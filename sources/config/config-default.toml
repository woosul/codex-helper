# Portable, non-secret Codex defaults for unregistered machines.
personality = "pragmatic"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[features]
multi_agent = true
js_repl = false

[agents]
max_threads = 4
max_depth = 1

[agents.scanner]
config_file = "agents/scanner.toml"

[agents.planner]
config_file = "agents/planner.toml"

[agents.developer]
config_file = "agents/developer.toml"

[agents.reviewer]
config_file = "agents/reviewer.toml"

[agents.verifier]
config_file = "agents/verifier.toml"
