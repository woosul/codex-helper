schema_version = 2
harness_version = "0.4.1"
minimum_codex_version = "0.144.5"

[paths]
codex_home = "${CODEX_HOME:-$HOME/.codex}"
config_home = "$HOME/.codex"
user_skills = "$HOME/.agents/skills"
user_bin = "$HOME/.local/bin"

[config]
source_pattern = "sources/config/config-{host}.toml"
default_source = "sources/config/config-default.toml"
target = "$HOME/.codex/config.toml"
asset_id = "global-config"
asset_version = "1.2.0"
state = "$HOME/.codex/.codex-helper/state.json"
preferences = "$HOME/.codex/.codex-helper/preferences.toml"
backups = "$HOME/.codex/backups/codex-helper"

[[assets]]
id = "global-agents"
kind = "symlink"
category = "guidance"
source = "AGENTS.md"
target = "${CODEX_HOME:-$HOME/.codex}/AGENTS.md"
scope = "global"
version = "1.0.0"

[[assets]]
id = "agent-scanner"
kind = "symlink"
category = "agents"
source = "sources/agents/scanner.toml"
target = "${CODEX_HOME:-$HOME/.codex}/agents/scanner.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "agent-planner"
kind = "symlink"
category = "agents"
source = "sources/agents/planner.toml"
target = "${CODEX_HOME:-$HOME/.codex}/agents/planner.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "agent-developer"
kind = "symlink"
category = "agents"
source = "sources/agents/developer.toml"
target = "${CODEX_HOME:-$HOME/.codex}/agents/developer.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "agent-reviewer"
kind = "symlink"
category = "agents"
source = "sources/agents/reviewer.toml"
target = "${CODEX_HOME:-$HOME/.codex}/agents/reviewer.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "agent-verifier"
kind = "symlink"
category = "agents"
source = "sources/agents/verifier.toml"
target = "${CODEX_HOME:-$HOME/.codex}/agents/verifier.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "profile-deep-review"
kind = "symlink"
category = "profiles"
source = "sources/profiles/deep-review.config.toml"
target = "${CODEX_HOME:-$HOME/.codex}/deep-review.config.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "profile-fast-scan"
kind = "symlink"
category = "profiles"
source = "sources/profiles/fast-scan.config.toml"
target = "${CODEX_HOME:-$HOME/.codex}/fast-scan.config.toml"
scope = "global"
version = "1.0.0"

[[assets]]
id = "rules-codex-helper"
kind = "symlink"
category = "rules"
source = "sources/rules/codex-helper.rules"
target = "${CODEX_HOME:-$HOME/.codex}/rules/codex-helper.rules"
scope = "global"
version = "1.0.0"

[[assets]]
id = "utility-codex-harness"
kind = "utility"
category = "utilities"
source = "bin/codex-harness"
target = "$HOME/.local/bin/codex-harness"
scope = "global"
version = "1.0.0"

[[assets]]
id = "utility-external-review"
kind = "utility"
category = "utilities"
source = "bin/codex-external-review"
target = "$HOME/.local/bin/codex-external-review"
scope = "global"
version = "1.0.0"

[[assets]]
id = "skill-parallel-review"
kind = "symlink"
category = "skills"
enabled = true
source = "sources/skills/parallel-review"
target = "$HOME/.agents/skills/parallel-review"
scope = "global"
version = "1.0.0"
upstream = "https://learn.chatgpt.com/docs/agent-configuration/subagents"
license = "local-adaptation"
last_reviewed = "2026-07-19"

[[assets]]
id = "skill-feature-delivery"
kind = "symlink"
category = "skills"
enabled = true
source = "sources/skills/feature-delivery"
target = "$HOME/.agents/skills/feature-delivery"
scope = "global"
version = "1.2.0"
upstream = "https://learn.chatgpt.com/docs/agent-configuration/subagents"
license = "local-adaptation"
last_reviewed = "2026-07-20"

[[assets]]
id = "skill-dual-loop-review"
kind = "symlink"
category = "skills"
enabled = true
source = "sources/skills/dual-loop-review"
target = "$HOME/.agents/skills/dual-loop-review"
scope = "global"
version = "1.0.0"
upstream = "https://www.philschmid.de/inner-loop-vs-outer-loop"
license = "local-adaptation"
last_reviewed = "2026-07-19"
